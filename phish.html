<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 935px;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            background-color: #fff;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15);
        }
        .form-section {
            flex: 1;
            padding: 20px;
            border-right: 1px solid #dbdbdb;
            text-align: center;
        }
        .logo {
            height: 51px;
            margin-bottom: 20px;
        }
        .form-section input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 14px;
            color: #262626;
            outline: none;
        }
        .form-section input:focus {
            border-color: #0095f6;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-primary:hover {
            background-color: #1877f2;
        }
        .social-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fafafa;
            padding: 40px;
        }
        .social-section h2 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .social-section p {
            font-size: 19px;
            color: #737373;
            margin-bottom: 30px;
        }
        .social-btn {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .social-btn:hover {
            background-color: #1877f2;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #737373;
        }
        .footer a {
            color: #003569;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }
        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }
        .separator span {
            padding: 0 10px;
            color: #737373;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <img src="https://www.instagram.com/static/images/web/icons/ico_instagram_2x.png/24964b9961c3.png" alt="Instagram Logo" class="logo">
            <form id="loginForm">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Log in</button>
            </form>
            <div class="separator">
                <span>or</span>
            </div>
            <a href="#" style="color: #3897f0; font-size: 14px; text-decoration: none;">Log in with Facebook</a>
            <div class="footer">
                <a href="#" style="color: #003569; text-decoration: none;">Forgot password?</a>
                <a href="/admin" style="color: #003569; text-decoration: none; margin-left: 10px;">Blog</a>
            </div>
        </div>
        <div class="social-section">
            <h2>Get the app.</h2>
            <p>Stay in the loop on what your friends are up to.</p>
            <button class="social-btn">Get the app</button>
        </div>
    </div>
